name: Update quest data

on:
  schedule:
    - cron: '17 * * * *'        # every hour
  workflow_dispatch: {}         # and a "Run workflow" button on the Actions tab

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm init -y >/dev/null
          npm install playwright@1.48.2
          npx playwright install --with-deps chromium
      # Quest data from tarkov.dev's data files (json.tarkov.dev), falling back to api.tarkov.dev. Allowed to fail; the wiki step below still runs.
      - name: Fetch quest data (tarkov.dev)
        continue-on-error: true
        run: node scripts/update-data.mjs
      # The same for PvE (separate quest list, written to data/quests-pve.json). Allowed to fail; the site then reads tarkov.dev directly.
      - name: Fetch PvE quest data (tarkov.dev)
        continue-on-error: true
        env:
          GAME_MODE: pve
        run: node scripts/update-data.mjs
      # Quests the wiki has and the game data does not (Arena, Event, Seasonal, Removed and newer quests), tagged by type.
      - name: Build wiki quests
        continue-on-error: true
        run: node scripts/build-wiki-quests.mjs
      # The wiki's photo of each extraction, shown when you click an extract pin. Refreshes weekly.
      - name: Build extract photos
        continue-on-error: true
        run: node scripts/build-extract-photos.mjs
      # When each exit is open and what it needs, from each map's wiki table (the Extract details list in the legend). Refreshes weekly.
      - name: Build extract info
        continue-on-error: true
        run: node scripts/build-extract-info.mjs
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain data)" ]; then
            git config user.name  "quest-data-bot"
            git config user.email "quest-data-bot@users.noreply.github.com"
            git add data
            git commit -m "Update quest data"
            git push
          else
            echo "Nothing to commit."
          fi
