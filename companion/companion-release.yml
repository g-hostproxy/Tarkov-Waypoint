# Copy this file to .github/workflows/companion-release.yml in the Tarkov-Waypoint repo.
# Builds the Windows installer and publishes it as a GitHub release (the app updates itself from there).
name: Build companion app
on:
  workflow_dispatch:
  push:
    tags: ['companion-v*']
permissions:
  contents: write
jobs:
  win:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: companion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
